<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TUR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0B1026;--c:#141A38;--ch:#1B2246;--chh:#232B55;--ol:#252C52;--olS:#3A4170;--on:#E8EAF8;--muted:#A3A8C8;
  --pri:#9D86FF;--sec:#5EE7FF;--amb:#FFB86B;--ok:#5EE6A8;--bad:#FF8A94;--warn:#FFB86B;
  --grad:linear-gradient(135deg,#5EE7FF,#7B5CFF);--hero:linear-gradient(135deg,#2A2F7A,#4B2FB0,#6A3FD8);
  --glow:rgba(157,134,255,.22);--shadow:rgba(123,92,255,.35);
}
:root.light{
  --bg:#F4F5FB;--c:#FFFFFF;--ch:#EDEEF7;--chh:#E5E7F3;--ol:#E2E4F0;--olS:#C5C8DB;--on:#12142A;--muted:#51556E;
  --pri:#5B3FE0;--sec:#0E7C93;--amb:#B25E00;--ok:#138A55;--bad:#C62839;--warn:#B25E00;--glow:rgba(91,63,224,.12);--shadow:rgba(91,63,224,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--on);font-family:Roboto,-apple-system,"SF Pro Text",system-ui,sans-serif;min-height:100%}
body{background-image:radial-gradient(circle at 85% 0%,var(--glow),transparent 60%);background-repeat:no-repeat;padding-bottom:120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--on)}
.hdr{display:flex;align-items:center;padding:16px 20px 10px}
.hdr h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
.hdr p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--pri);text-transform:uppercase}
.logo{width:48px;height:48px;border-radius:14px;background:#0B1026;display:flex;align-items:center;justify-content:center;border:1px solid var(--ol);flex-shrink:0}
.body{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.card{background:var(--c);border:1px solid var(--ol);border-radius:24px;padding:14px}
.hero{border-radius:30px;padding:22px;background:var(--hero);position:relative;overflow:hidden;color:#fff}
.lbl{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center}
.sec{display:flex;align-items:center;padding:10px 4px 0}
.sec h2{flex:1;margin:0;font-size:16px;font-weight:600}
.sec span{font-size:14px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tb{width:76px;border-radius:18px;padding:10px 0;text-align:center;flex-shrink:0;background:color-mix(in srgb,var(--pri) 12%,transparent)}
.tb b{display:block;font-size:22px;color:var(--pri)}
.tb small{font-size:12px;color:var(--muted)}
.badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{background:var(--ch)}
.sw{width:52px;height:32px;border-radius:99px;background:var(--pri);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.off{background:transparent;border:2px solid var(--olS)}
.sw.off::after{right:auto;left:6px;top:6px;width:16px;height:16px;background:var(--olS)}
.muted{color:var(--muted)}
.small{font-size:12px}
.t16{font-size:16px;font-weight:600}
.t14{font-size:14px;font-weight:600}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{opacity:.45}
.nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));height:68px;border-radius:34px;background:var(--ch);border:1px solid var(--ol);display:flex;gap:4px;padding:6px;box-shadow:0 10px 30px var(--shadow);max-width:528px;margin:0 auto;z-index:5}
.ni{flex:1;display:flex;align-items:center;justify-content:center;border-radius:28px;font-size:14px;font-weight:600;color:#fff;gap:8px;transition:flex .25s}
.ni.on{flex:2.2;background:var(--grad)}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));height:58px;padding:0 22px;border-radius:99px;background:var(--grad);display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:#fff;box-shadow:0 8px 24px var(--shadow);z-index:5}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--ch)}
.seg button{flex:1;height:38px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--olS);font-size:14px;color:var(--muted)}
.chip.on{background:var(--pri);border-color:transparent;color:#fff;font-weight:600}
:root:not(.light) .chip.on{color:#1B0B66}
.btnG{height:54px;border-radius:99px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;width:100%}
.btnG:disabled{opacity:.45}
.btnO{height:48px;border-radius:99px;border:1px solid var(--olS);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;width:100%;color:var(--pri)}
.field{width:100%;border:1px solid var(--olS);border-radius:18px;padding:14px;background:transparent;font-size:16px;outline:none}
.field:focus{border-color:var(--pri)}
.fl{font-size:12px;color:var(--muted);margin:0 0 6px 4px;font-weight:600}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.bar{height:8px;border-radius:99px;background:var(--ch);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.empty{text-align:center;padding:22px 14px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sheetBg{position:fixed;inset:0;background:rgba(5,7,15,.55);z-index:20;opacity:0;pointer-events:none;transition:.2s}
.sheetBg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--ol);padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--olS);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:600}
.pending{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;max-width:528px;margin:0 auto}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-120%);background:var(--chh);border:1px solid var(--ol);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;transition:.25s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.banner{border-radius:18px;padding:10px 14px;font-size:13px;background:color-mix(in srgb,var(--amb) 14%,transparent);color:var(--amb);display:flex;gap:8px;align-items:center}
.stat{flex:1}
.stat b{display:block;font-size:28px;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="pending" id="pending"><button class="btnG" id="saveBtn">💾 Saqlash</button></div>
<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);

// ---------- ikonkalar va belgi ----------
const P='M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z';
const ico={cal:'M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z',list:'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',wallet:'M21 18v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1h-9a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h9zm-9-2h10V8H12v8zm4-2.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z',person:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',check:'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',close:'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',warn:'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',bell:'M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',ref:'M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z',add:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',del:'M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',mail:'M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z',info:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z'};
const I=(n,c,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path fill="${c}" d="${n==='phone'?P:ico[n]}"/></svg>`;
const bars=[];for(let i=0;i<36;i++){const t=i/36*Math.PI*2;bars.push(i===0?53:38+7*Math.sin(t*3+.6)+4*Math.sin(t*7+1.3)+3*Math.sin(t*11))}
let gid=0;
function mark(s,mono){const id='m'+(gid++);let b='';bars.forEach((r,i)=>{const a=i/36*Math.PI*2,x=Math.sin(a),y=Math.cos(a);const op=mono||i===0?1:(.45+.55*(r-28)/24);b+=`<line x1="${60+27*x}" y1="${60-27*y}" x2="${60+r*x}" y2="${60-r*y}" stroke="${mono||(i===0?'#FFB86B':'url(#g'+id+')')}" stroke-opacity="${op}" stroke-width="3.4" stroke-linecap="round"/>`});
return `<svg width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g${id}" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5EE7FF"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient></defs>${b}<circle cx="60" cy="60" r="22.5" fill="none" stroke="${mono||'#7B5CFF'}" stroke-opacity="${mono?.6:.35}" stroke-width="1.2"/><circle cx="60" cy="60" r="18.5" fill="url(#g${id})"/><path transform="translate(47 47) scale(1.08)" fill="#fff" d="${P}"/></svg>`}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const badge=(n,c,s=40)=>`<div class="badge" style="width:${s}px;height:${s}px;background:color-mix(in srgb,${c} 16%,transparent)">${I(n,c,s/2)}</div>`;
const pill=(t,c,ic)=>`<span class="pill" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${ic?I(ic,c,12):''}${esc(t)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#7B5CFF','#5EE7FF','#FFB86B','#FF7A9A','#5EE6A8','#FFE066','#9DA8FF','#B07BFF','#8A91B4'];

// ---------- vaqt va pul ----------
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const two=n=>String(n).padStart(2,'0');
const money=v=>(v<0?'−':'')+Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const short=v=>v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+' mln':v>=1e3?Math.floor(v/1e3)+' ming':String(v);
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dayLabel(ms){const d=new Date(ms),t=new Date(),tm=new Date();tm.setDate(t.getDate()+1);if(sameDay(d,t))return 'Bugun';if(sameDay(d,tm))return 'Ertaga';return `${two(d.getDate())}.${two(d.getMonth()+1)}`}
const hm=ms=>{const d=new Date(ms);return `${two(d.getHours())}:${two(d.getMinutes())}`};
function until(ms){let m=Math.max(0,Math.ceil((ms-Date.now())/60000));const d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;
  if(d>0)return h?`${d} kun ${h} soatdan keyin`:`${d} kundan keyin`;if(h>0)return mm?`${h} soat ${mm} daqiqadan keyin`:`${h} soatdan keyin`;return m>1?`${m} daqiqadan keyin`:'1 daqiqa ichida'}
function beforeLabel(m){if(!m)return "O'z vaqtida";if(m%1440===0)return `${m/1440} kun oldin`;if(m%60===0)return `${m/60} soat oldin`;return `${m} daq oldin`}
function range(p){const d=new Date();d.setHours(0,0,0,0);
  if(p==='WEEK'){const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd)}
  if(p==='MONTH')d.setDate(1);
  if(p==='YEAR'){d.setMonth(0,1)}
  const e=new Date(d);
  if(p==='DAY')e.setDate(e.getDate()+1);if(p==='WEEK')e.setDate(e.getDate()+7);if(p==='MONTH')e.setMonth(e.getMonth()+1);if(p==='YEAR')e.setFullYear(e.getFullYear()+1);
  return [d.getTime(),e.getTime()]}
const PERIODS=[['DAY','Bugun'],['WEEK','Hafta'],['MONTH','Oy'],['YEAR','Yil']];
const keyOf=n=>{n=String(n).trim().toLowerCase();return n.charAt(0).toUpperCase()+n.slice(1)};

// ---------- ma'lumot ----------
let D=null, demo=false, ops=[], tmpId=-1;
const ui={tab:+(sessionStorage.getItem('tab')||0),period:'MONTH'};

async function decode(b64){
  const s=b64.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s+'==='.slice((s.length+3)%4));
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream('deflate-raw');
  const txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}
function demoData(){
  const now=Date.now(),s=x=>Math.floor(x/1000),day=86400000;
  const tx=[[11,0,25000,'Tushlik',s(now-3600e3)],[10,0,32000,'Taksi',s(now-5*3600e3)],[9,0,180000,'Bozor',s(now-day)],[8,0,120000,'Benzin',s(now-2*day)],[7,0,45000,'Tushlik',s(now-2*day)],[6,1,5000000,'Oylik',s(now-4*day)],[5,0,540000,'Kommunal',s(now-5*day)],[4,0,400000,'Kiyim',s(now-6*day)],[3,0,38000,'Taksi',s(now-7*day)]];
  const d={v:1,ts:s(now),me:{s:'TUR-0001',n:'Namuna foydalanuvchi',p:'+998901234567',admin:true},bal:3620000,m:new Date().getMonth(),
    tx,notes:[[1,"To'yga borish",s(now+day+3*3600e3),120,'Bir marta'],[2,'Dori ichish',s(now+5*3600e3),0,'Har kuni']],
    calls:[[1,'Onamga','+998 90 123 45 67',s(now+2*3600e3),'Har kuni',1,''],[2,'Ofis','+998 71 200 00 00',s(now+day),'Bir marta',1,'Men majlisdaman, chiqsam qo\'ng\'iroq qilaman']],
    rep:[['ANSWERED',s(now-3600e3),'+998 90 123 45 67','Onamga',187],['NO_ANSWER',s(now-day),'+998 71 200 00 00','Ofis',0],['ANSWERED',s(now-2*day),'+998 93 555 11 22','',64]],sum:{},days:[]};
  rebuildSums(d,true);return d;
}
/** Namuna yoki optimistik o'zgarishdan keyin hisob-kitobni yangilash (faqat demo) */
function rebuildSums(d){
  d.sum={};
  for(const [p] of PERIODS){const [f,t]=range(p);const l=d.tx.filter(x=>x[4]*1000>=f&&x[4]*1000<t);
    const g=arr=>{const m={};arr.forEach(x=>{const k=keyOf(x[3]);m[k]=(m[k]||0)+x[2]});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    d.sum[p]={i:l.filter(x=>x[1]).reduce((a,x)=>a+x[2],0),e:l.filter(x=>!x[1]).reduce((a,x)=>a+x[2],0),top:g(l.filter(x=>!x[1])),it:g(l.filter(x=>x[1]))}}
  const [mf]=range('MONTH');const dm=new Date(mf);const n=new Date(dm.getFullYear(),dm.getMonth()+1,0).getDate();d.days=Array(n).fill(0);
  d.tx.forEach(x=>{const t=new Date(x[4]*1000);if(!x[1]&&t.getTime()>=mf&&t.getMonth()===dm.getMonth())d.days[t.getDate()-1]+=x[2]});
}
/** Yozuvni barcha mos davr hisoblariga qo'shish (+1) yoki ayirish (−1) */
function applyTx(x,sign){
  const ms=x[4]*1000,k=keyOf(x[3]);
  for(const [p] of PERIODS){const [f,t]=range(p);if(ms<f||ms>=t)continue;const s=D.sum[p];
    if(x[1]){s.i+=sign*x[2];bump(s.it,k,sign*x[2])}else{s.e+=sign*x[2];bump(s.top,k,sign*x[2])}}
  const [mf,mt]=range('MONTH');if(!x[1]&&ms>=mf&&ms<mt)D.days[new Date(ms).getDate()-1]+=sign*x[2];
  D.bal+=sign*(x[1]?x[2]:-x[2]);
}
function bump(list,k,v){const e=list.find(a=>keyOf(a[0])===k);if(e)e[1]+=v;else if(v>0)list.push([k,v]);
  for(let i=list.length-1;i>=0;i--)if(list[i][1]<=0)list.splice(i,1);list.sort((a,b)=>b[1]-a[1])}

// ---------- o'zgarishlar (botga yuboriladi) ----------
function queue(op){
  const json=JSON.stringify({ops:[...ops,op]});
  if(json.length>3900){toast("Avval «Saqlash»ni bosing");return false}
  ops.push(op);syncPending();haptic('light');return true;
}
function unqueue(pred){const i=ops.findIndex(pred);if(i>=0){ops.splice(i,1);syncPending();return true}return false}
function syncPending(){
  const n=ops.length;
  if(inTg){
    if(n){tg.MainButton.setParams({text:`💾 Saqlash · ${n} ta o'zgarish`,color:'#7B5CFF',text_color:'#ffffff'});tg.MainButton.show()}else tg.MainButton.hide();
  }else{
    document.getElementById('pending').style.display=n?'block':'none';
    document.getElementById('saveBtn').textContent=`💾 Saqlash · ${n} ta o'zgarish`;
  }
}
function save(){
  const data=JSON.stringify({ops:ops.map(({_tmp,...o})=>o)});
  if(inTg){tg.HapticFeedback.notificationOccurred('success');tg.sendData(data)}
  else{alert("Telegram ichida bu ma'lumot botga yuboriladi:\n\n"+data);ops=[];syncPending()}
}
function refresh(){
  if(inTg){tg.sendData(JSON.stringify({ops:[]}))}else toast('Telegram ichida ishlaydi');
}
function haptic(k){try{inTg&&tg.HapticFeedback.impactOccurred(k)}catch(e){}}
let toastT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}

// ---------- ekranlar ----------
const TABS=[['cal','Eslatmalar',"Eslatmalar va qo'ng'iroqlar"],['wallet','Hamyon','Kirim, chiqim va qoldiq'],['list','Tarix',"Qo'ng'iroqlar natijasi"],['person','Profil','Ma\'lumotlar va yordam']];
function todayLabel(){const d=new Date();return `${WD[d.getDay()]}, ${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`}

function render(){

function setPeriod(p){ui.period=p;haptic('light');render()}
function donut(s){
  const parts=s.top.slice(0,8);const other=s.top.slice(8).reduce((a,x)=>a+x[1],0);if(other>0)parts.push(['Boshqalar',other]);
  const R=52,C=2*Math.PI*R;let off=0;const gap=parts.length>1?2:0;
  const arcs=parts.map(([n,v],i)=>{const len=v/s.e*C;const seg=`<circle r="${R}" cx="66" cy="66" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="22" stroke-dasharray="${Math.max(.5,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;off+=len;return seg}).join('');
  const maxV=parts[0][1];
  return `<div class="card"><div class="t16">Nimaga sarflandi</div><div class="row" style="margin-top:12px;gap:16px">
    <div style="position:relative;width:132px;height:132px;flex-shrink:0"><svg width="132" height="132"><circle r="${R}" cx="66" cy="66" fill="none" stroke="${css('--ch')}" stroke-width="22"/>${arcs}</svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="small muted">Chiqim</span><b class="t16">${short(s.e)}</b></div></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">${parts.map(([n,v],i)=>`<div class="row"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span><span class="trunc" style="flex:1;margin-left:8px;font-size:14px">${esc(n)}</span><b class="small muted">${Math.round(v*100/s.e)}%</b></div>`).join('')}</div></div>
    <div style="margin-top:12px">${parts.map(([n,v],i)=>`<div class="row" style="padding:3px 0;gap:8px"><span class="small trunc" style="width:96px">${esc(n)}</span><div class="bar" style="flex:1"><i style="width:${Math.max(2,v/maxV*100)}%;background:${COLORS[i%COLORS.length]}"></i></div><span class="small" style="min-width:74px;text-align:right">${money(v)}</span></div>`).join('')}</div></div>`;
}
function dailyBars(){
  const days=D.days,max=Math.max(1,...days),today=new Date().getDate()-1;const n=days.length;
  const avg=Math.round(days.slice(0,today+1).reduce((a,b)=>a+b,0)/(today+1));
  const W=320,H=110,slot=W/n,w=slot*.62;
  const rects=days.map((v,i)=>{const h=v>0?Math.max(3,v/max*H):1;return `<rect x="${i*slot+(slot-w)/2}" y="${H-h}" width="${w}" height="${h}" rx="${w/2}" fill="${i===today?'#FFB86B':css('--pri')}" fill-opacity="${i===today?1:.5}"><title>${i+1}-kun: ${money(v)}</title></rect>`}).join('');
  return `<div class="card"><div class="row"><div class="t16" style="flex:1">${MONTHS[D.m]} · kunlik chiqim</div>${pill("o'rtacha "+short(avg),css('--pri'))}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:110px;margin-top:12px;display:block">${rects}</svg>
    <div class="row small muted" style="justify-content:space-between;margin-top:4px"><span>1</span><span>10</span><span>20</span><span>${n}</span></div></div>`;
}
function delTx(id){
  const x=D.tx.find(t=>t[0]===id);if(!x)return;
  confirmAsk(`${x[1]?'+':'−'}${money(x[2])} · ${x[3]} — o'chirilsinmi?`,()=>{
    D.tx=D.tx.filter(t=>t[0]!==id);applyTx(x,-1);
    if(id<0)unqueue(o=>o._tmp===id);else queue({a:'txdel',id});render()});
}

function drawNote(){
  const B=[[0,"O'z vaqtida"],[15,'15 daq'],[30,'30 daq'],[60,'1 soat'],[120,'2 soat'],[180,'3 soat'],[1440,'1 kun']];
  const R=[['NONE','Bir marta'],['DAILY','Har kuni'],['WEEKDAYS','Ish kunlari'],['WEEKLY','Har hafta']];

function pickDay(k){NF.day=k;const d=new Date();if(k==='tomorrow')d.setDate(d.getDate()+1);if(k!=='pick')NF.date=`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;drawNote()}
function noteTime(){const [y,m,d]=NF.date.split('-').map(Number);const [h,mi]=(NF.time||'').split(':').map(Number);if(!y||isNaN(h))return 0;return new Date(y,m-1,d,h,mi||0).getTime()}
function chkNote(){const t=noteTime();const w=document.getElementById('nWarn'),b=document.getElementById('nSave');if(!w)return;
  let msg='';if(!NF.text.trim())msg='';else if(!t||t<=Date.now())msg="Bu vaqt o'tib ketgan";else if(NF.before&&t-NF.before*60000<=Date.now())msg='Oldindan eslatish vaqti o\'tib ketgan — faqat o\'z vaqtida keladi';
  w.textContent=msg;b.disabled=!NF.text.trim()||!t||t<=Date.now()}
function addNote(){
  const t=noteTime();if(!NF.text.trim()||t<=Date.now())return;
  const id=tmpId--;const repL={NONE:'Bir marta',DAILY:'Har kuni',WEEKDAYS:'Ish kunlari (Du–Ju)',WEEKLY:'Har hafta'}[NF.rep];
  if(!queue({a:'note',text:NF.text.trim(),t:Math.floor(t/1000),before:NF.before,rep:NF.rep,_tmp:id}))return;
  D.notes.push([id,NF.text.trim(),Math.floor(t/1000),NF.before,repL]);closeSheet();toast("✅ Qo'shildi — «Saqlash»ni bosing");render();
}

  <div class="seg" style="margin-bottom:14px">${[[0,'− Chiqim'],[1,'+ Kirim']].map(([v,l])=>`<button class="${TF.inc===v?'on':''}" onclick="TF.inc=${v};drawTx()">${l}</button>`).join('')}</div>
  <div class="fl">Summa (so'm)</div>
  <input id="tAmt" class="field" inputmode="numeric" placeholder="25 000" value="${TF.amt?money(+TF.amt):''}" oninput="fmtAmt(this)" style="font-size:24px;font-weight:700">
  <div class="fl" style="margin-top:14px">${TF.inc?'Sababi':'Nimaga'}</div>
  <input id="tNote" class="field" maxlength="80" placeholder="${TF.inc?'Masalan: oylik':'Masalan: tushlik'}" value="${esc(TF.note)}" oninput="TF.note=this.value;chkTx()">
  <div class="chips" style="margin-top:10px">${sug.map(s=>`<button class="chip ${keyOf(TF.note)===keyOf(s)?'on':''}" onclick="TF.note=this.textContent;drawTx()">${esc(s)}</button>`).join('')}</div>
  <button class="btnG" id="tSave" onclick="addTx()" style="margin-top:18px">Qo'shish</button>`);
  chkTx();
}
function fmtAmt(el){const v=el.value.replace(/\D/g,'').slice(0,12);TF.amt=v;el.value=v?money(+v):'';chkTx()}
function chkTx(){const b=document.getElementById('tSave');if(b)b.disabled=!(+TF.amt>0)}
function addTx(){
  const amt=+TF.amt;if(!(amt>0))return;const note=TF.note.trim()||(TF.inc?'Kirim':'Boshqa');const id=tmpId--;const ts=Math.floor(Date.now()/1000);
  if(!queue({a:'tx',inc:TF.inc,amt,note,ts,_tmp:id}))return;
  const x=[id,TF.inc,amt,note,ts];D.tx.unshift(x);applyTx(x,1);closeSheet();toast("✅ Qo'shildi — «Saqlash»ni bosing");render();
}

// ---------- ishga tushirish ----------
async function boot(){
  if(inTg){
    tg.ready();tg.expand();
    if(tg.colorScheme==='light')document.documentElement.classList.add('light');
    try{tg.setHeaderColor(css('--bg'));tg.setBackgroundColor(css('--bg'))}catch(e){}
    tg.MainButton.onClick(save);tg.BackButton.onClick(closeSheet);
  }else if(matchMedia('(prefers-color-scheme: light)').matches&&new URLSearchParams(location.search).get('theme')!=='dark')document.documentElement.classList.add('light');
  if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.classList.add('light');
  document.getElementById('saveBtn').onclick=save;
  const m=location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
  try{
    if(m){D=await decode(m[1])}else{D=demoData();demo=true}
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="body" style="padding-top:40px"><div class="card empty"><div class="t16">Ma'lumotni o'qib bo'lmadi</div><div class="small muted" style="margin-top:6px">Telegram'ni yangilang yoki botda /start bosib, «📱 TUR ilova»ni qayta oching.</div></div></div>`;return;
  }
  D.notes=D.notes||[];D.calls=D.calls||[];D.rep=D.rep||[];D.tx=D.tx||[];D.days=D.days||[];
  for(const [p] of PERIODS){D.sum[p]=D.sum[p]||{i:0,e:0,top:[],it:[]};D.sum[p].top=D.sum[p].top||[];D.sum[p].it=D.sum[p].it||[]}
  render();
}
boot();
</script>
