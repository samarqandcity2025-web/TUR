<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TUR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0B1026;--c:#141A38;--ch:#1B2246;--chh:#232B55;--ol:#252C52;--olS:#3A4170;--on:#E8EAF8;--muted:#A3A8C8;
  --pri:#9D86FF;--sec:#5EE7FF;--amb:#FFB86B;--ok:#5EE6A8;--bad:#FF8A94;--warn:#FFB86B;
  --grad:linear-gradient(135deg,#5EE7FF,#7B5CFF);--hero:linear-gradient(135deg,#2A2F7A,#4B2FB0,#6A3FD8);
  --glow:rgba(157,134,255,.22);--shadow:rgba(123,92,255,.35);
}
:root.light{
  --bg:#F4F5FB;--c:#FFFFFF;--ch:#EDEEF7;--chh:#E5E7F3;--ol:#E2E4F0;--olS:#C5C8DB;--on:#12142A;--muted:#51556E;
  --pri:#5B3FE0;--sec:#0E7C93;--amb:#B25E00;--ok:#138A55;--bad:#C62839;--warn:#B25E00;--glow:rgba(91,63,224,.12);--shadow:rgba(91,63,224,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--on);font-family:Roboto,-apple-system,"SF Pro Text",system-ui,sans-serif;min-height:100%}
body{background-image:radial-gradient(circle at 85% 0%,var(--glow),transparent 60%);background-repeat:no-repeat;padding-bottom:120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--on)}
.hdr{display:flex;align-items:center;padding:16px 20px 10px}
.hdr h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
.hdr p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--pri);text-transform:uppercase}
.logo{width:48px;height:48px;border-radius:14px;background:#0B1026;display:flex;align-items:center;justify-content:center;border:1px solid var(--ol);flex-shrink:0}
.body{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.card{background:var(--c);border:1px solid var(--ol);border-radius:24px;padding:14px}
.hero{border-radius:30px;padding:22px;background:var(--hero);position:relative;overflow:hidden;color:#fff}
.lbl{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.row{display:flex;align-items:center}
.btn2{background:var(--c);border:1px solid var(--ol);color:var(--on);border-radius:16px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.sec{display:flex;align-items:center;padding:10px 4px 0}
.sec h2{flex:1;margin:0;font-size:16px;font-weight:600}
.sec span{font-size:14px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tb{width:76px;border-radius:18px;padding:10px 0;text-align:center;flex-shrink:0;background:color-mix(in srgb,var(--pri) 12%,transparent)}
.tb b{display:block;font-size:22px;color:var(--pri)}
.tb small{font-size:12px;color:var(--muted)}
.badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{background:var(--ch)}
.sw{width:52px;height:32px;border-radius:99px;background:var(--pri);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.off{background:transparent;border:2px solid var(--olS)}
.sw.off::after{right:auto;left:6px;top:6px;width:16px;height:16px;background:var(--olS)}
.muted{color:var(--muted)}
.small{font-size:12px}
.t16{font-size:16px;font-weight:600}
.t14{font-size:14px;font-weight:600}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{opacity:.45}
.nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));height:68px;border-radius:34px;background:var(--ch);border:1px solid var(--ol);display:flex;gap:4px;padding:6px;box-shadow:0 10px 30px var(--shadow);max-width:528px;margin:0 auto;z-index:5}
.ni{flex:1;display:flex;align-items:center;justify-content:center;border-radius:28px;font-size:14px;font-weight:600;color:#fff;gap:8px;transition:flex .25s}
.ni.on{flex:2.2;background:var(--grad)}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));height:58px;padding:0 22px;border-radius:99px;background:var(--grad);display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;color:#fff;box-shadow:0 8px 24px var(--shadow);z-index:5}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--ch)}
.seg button{flex:1;height:38px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--olS);font-size:14px;color:var(--muted)}
button.chip{background:transparent;font-family:inherit;cursor:pointer}
.chip.on{background:var(--pri);border-color:transparent;color:#fff;font-weight:600}
:root:not(.light) .chip.on{color:#1B0B66}
.btnG{height:54px;border-radius:99px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;width:100%}
.btnG:disabled{opacity:.45}
.btnO{height:48px;border-radius:99px;border:1px solid var(--olS);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;width:100%;color:var(--pri)}
.field{width:100%;border:1px solid var(--olS);border-radius:18px;padding:14px;background:transparent;font-size:16px;outline:none}
.field:focus{border-color:var(--pri)}
.fl{font-size:12px;color:var(--muted);margin:0 0 6px 4px;font-weight:600}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.bar{height:8px;border-radius:99px;background:var(--ch);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.empty{text-align:center;padding:22px 14px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sheetBg{position:fixed;inset:0;background:rgba(5,7,15,.55);z-index:20;opacity:0;pointer-events:none;transition:.2s}
.sheetBg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--ol);padding:10px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:99px;background:var(--olS);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:22px;font-weight:600}
.pending{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;max-width:528px;margin:0 auto}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-120%);background:var(--chh);border:1px solid var(--ol);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:30;transition:.25s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.banner{border-radius:18px;padding:10px 14px;font-size:13px;background:color-mix(in srgb,var(--amb) 14%,transparent);color:var(--amb);display:flex;gap:8px;align-items:center}
.stat{flex:1}
.stat b{display:block;font-size:28px;margin-top:10px}
</style>
</head>
<body>

<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#7B5CFF','#5EE7FF','#FFB86B','#FF7A9A','#5EE6A8','#FFE066','#9DA8FF','#B07BFF','#8A91B4'];

// ---------- vaqt va pul ----------
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const WD=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}

function beforeLabel(m){if(!m)return "O'z vaqtida";if(m%1440===0)return `${m/1440} kun oldin`;if(m%60===0)return `${m/60} soat oldin`;return `${m} daq oldin`}
/** Snapshot "hozir"i (demo'da — haqiqiy vaqt): bugungi hisoblar shu kunga nisbatan */
const refMs=()=>(!demo&&D&&D.ts)?D.ts*1000:Date.now();
function range(p){const d=new Date(refMs());d.setHours(0,0,0,0);
  if(p==='WEEK'){const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd)}
  if(p==='MONTH')d.setDate(1);
  if(p==='YEAR'){d.setMonth(0,1)}
  const e=new Date(d);
  if(p==='DAY')e.setDate(e.getDate()+1);if(p==='WEEK')e.setDate(e.getDate()+7);if(p==='MONTH')e.setMonth(e.getMonth()+1);if(p==='YEAR')e.setFullYear(e.getFullYear()+1);
  return [d.getTime(),e.getTime()]}
const PERIODS=[['DAY','Bugun'],['WEEK','Hafta'],['MONTH','Oy'],['YEAR','Yil']];

let D=null, demo=false, ops=[], tmpId=-1;

async function decode(b64){
  const s=b64.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s+'==='.slice((s.length+3)%4));

    txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();

function demoData(){
  const now=Date.now(),s=x=>Math.floor(x/1000),day=86400000;
  const tx=[[11,0,25000,'Tushlik',s(now-3600e3)],[10,0,32000,'Taksi',s(now-5*3600e3)],[9,0,180000,'Bozor',s(now-day)],[8,0,120000,'Benzin',s(now-2*day)],[7,0,45000,'Tushlik',s(now-2*day)],[6,1,5000000,'Oylik',s(now-4*day)],[5,0,540000,'Kommunal',s(now-5*day)],[4,0,400000,'Kiyim',s(now-6*day)],[3,0,38000,'Taksi',s(now-7*day)]];
  const d={v:1,ts:s(now),me:{s:'TUR-0001',n:'Namuna foydalanuvchi',p:'+998901234567',admin:true},bal:3620000,m:new Date().getMonth(),

    calls:[[1,'Onamga','+998 90 123 45 67',s(now+2*3600e3),'Har kuni',1,''],[2,'Ofis','+998 71 200 00 00',s(now+day),'Bir marta',1,'Men majlisdaman, chiqsam qo\'ng\'iroq qilaman']],

  const t0=new Date();t0.setHours(0,0,0,0);const T=h=>s(t0.getTime()+h*3600e3);
  // Namuna faollik: uy → ish → tushlik → ish → bozor (Samarqand)
  const pts=[[39.6542,66.9597],[39.6555,66.9650],[39.6560,66.9720],[39.6548,66.9790],[39.6542,66.9857],[39.6530,66.9880],[39.6520,66.9905],[39.6542,66.9857],[39.6580,66.9800],[39.6610,66.9750]];
  const enc=a=>{let o='',pl=0,pn=0;const put=v=>{v=v<0?~(v<<1):v<<1;while(v>=32){o+=String.fromCharCode((32|(v&31))+63);v>>=5}o+=String.fromCharCode(v+63)};a.forEach(([la,lo])=>{la=Math.round(la*1e5);lo=Math.round(lo*1e5);put(la-pl);put(lo-pn);pl=la;pn=lo});return o};
  d.loc={m:6400,p:enc(pts),t:[0,8.3,8.4,8.5,8.6,13.05,13.1,13.95,18.45,18.6].map(h=>Math.round(h*60)),s:[[39.6542,66.9597,T(0),T(8.2),'🏠 Uy'],[39.6542,66.9857,T(8.6),T(13),'💼 Ish'],[39.6520,66.9905,T(13.1),T(13.8),"Registon ko'chasi 12"],[39.6542,66.9857,T(14),T(18.3),'💼 Ish'],[39.6610,66.9750,T(18.6),T(19.4),'Siyob bozori']]};
  // O'tgan kunlar (namuna): har kuni uy → ish → uy
  d.loc.w=[];for(let k=1;k<7;k++){const b=t0.getTime()/1000-k*86400;const H=h=>Math.round(b+h*3600);

/** Namuna yoki optimistik o'zgarishdan keyin hisob-kitobni yangilash (faqat demo) */
function rebuildSums(d){
  d.sum={};
  for(const [p] of PERIODS){const [f,t]=range(p);const l=d.tx.filter(x=>x[4]*1000>=f&&x[4]*1000<t);
    const g=arr=>{const m={};arr.forEach(x=>{const k=keyOf(x[3]);m[k]=(m[k]||0)+x[2]});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
    d.sum[p]={i:l.filter(x=>x[1]).reduce((a,x)=>a+x[2],0),e:l.filter(x=>!x[1]).reduce((a,x)=>a+x[2],0),top:g(l.filter(x=>!x[1])),it:g(l.filter(x=>x[1]))}}
  const [mf]=range('MONTH');const dm=new Date(mf);const n=new Date(dm.getFullYear(),dm.getMonth()+1,0).getDate();d.days=Array(n).fill(0);
  d.tx.forEach(x=>{const t=new Date(x[4]*1000);if(!x[1]&&t.getTime()>=mf&&t.getMonth()===dm.getMonth())d.days[t.getDate()-1]+=x[2]});
}
/** Yozuvni barcha mos davr hisoblariga qo'shish (+1) yoki ayirish (−1) */
function applyTx(x,sign){
  const ms=x[4]*1000,k=keyOf(x[3]);
  for(const [p] of PERIODS){const [f,t]=range(p);if(ms<f||ms>=t)continue;const s=D.sum[p];
    if(x[1]){s.i+=sign*x[2];bump(s.it,k,sign*x[2])}else{s.e+=sign*x[2];bump(s.top,k,sign*x[2])}}
  const [mf,mt]=range('MONTH');if(!x[1]&&ms>=mf&&ms<mt){const i=new Date(ms).getDate()-1;D.days[i]=(D.days[i]||0)+sign*x[2]}
  D.bal+=sign*(x[1]?x[2]:-x[2]);
}
function bump(list,k,v){const e=list.find(a=>keyOf(a[0])===k);if(e)e[1]+=v;else if(v>0)list.push([k,v]);
  for(let i=list.length-1;i>=0;i--)if(list[i][1]<=0)list.splice(i,1);list.sort((a,b)=>b[1]-a[1])}

const opsJson=list=>JSON.stringify({ops:list.map(({_tmp,...o})=>o)});
function queue(op){
  const json=opsJson([...ops,op]);
  if(new TextEncoder().encode(json).length>4000){toast("Avval «Saqlash»ni bosing");return false}
  ops.push(op);syncPending();haptic('light');return true;
}
function unqueue(pred){const i=ops.findIndex(pred);if(i>=0){ops.splice(i,1);syncPending();return true}return false}
function syncPending(){
  const n=ops.length;
  if(inTg){

  }else{
    document.getElementById('pending').style.display=n?'block':'none';
    document.getElementById('saveBtn').textContent=`💾 Saqlash · ${n} ta o'zgarish`;

}
function send(data){

  try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}return true;
}
function save(){

}

    <button class="btn2" onclick="ask()" style="background:linear-gradient(135deg,#5EE7FF,#7B5CFF);color:#fff;border:0;padding:0 18px">Ko'rsatish</button></div>

  h+=`<div class="card" style="padding:0;overflow:hidden;margin-top:10px"><div id="map" style="height:360px;background:#e9e5dc"></div></div>`;
  if(L.p||st.length){
    const mx=maxMin();
    h+=`<div class="card" style="margin-top:10px"><div class="row"><div id="selT" style="font-size:26px;font-weight:700;color:var(--pri)">--:--</div><div id="selW" class="t14" style="flex:1;margin-left:12px"></div></div>
      <input id="tsl" type="range" min="0" max="${mx}" value="${mx}" step="1" oninput="onSlide(+this.value)" style="width:100%;margin-top:12px;accent-color:#FFB86B">
      <div class="row small muted"><span style="flex:1">00:00</span><span>hozir</span></div>
      <div class="small muted" style="margin-top:6px">Surgichni suring — sariq nuqta o'sha paytdagi joyingizni ko'rsatadi</div></div>`;
    if(st.length)h+=`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn2" onclick="openMap('g')" style="flex:1">🗺 Google Maps</button><button class="btn2" onclick="openMap('y')" style="flex:1">🗺 Yandex Xarita</button></div>`;
  }
  h+=`<div class="sec"><h2>Kun xronologiyasi</h2><span>${st.length} ta joy</span></div>`;
  if(!st.length)h+=`<div class="card empty muted small">${L.p?"Uzoq to'xtalgan joy yo'q":"Bugun joylashuv yozilmagan"}</div>`;
  else h+=`<div class="card">${st.map((s,i)=>{const last=i===st.length-1;const mins=Math.round((s[3]-s[2])/60);
    return `<div class="row" style="padding:6px 0;cursor:pointer" onclick="jumpStop(${i})"><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5EE7FF,#7B5CFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none">${i+1}</div>
      <div style="flex:1;margin-left:12px;min-width:0"><div class="t14 trunc">${esc(s[4])}</div><div class="small muted">${hm(s[2]*1000)} – ${last?'hozir':hm(s[3]*1000)}</div></div><div class="small" style="color:var(--pri);font-weight:600">${durMin(mins)}</div></div>`+
      (last?'':`<div class="small muted" style="margin-left:13px;border-left:2px solid var(--ol);padding:4px 0 4px 22px">🚗 ${hm(s[3]*1000)}–${hm(st[i+1][2]*1000)} · ${durMin(Math.max(0,Math.round((st[i+1][2]-s[3])/60)))} yo'lda</div>`)}).join('')}</div>`;
  h+=`<div class="small muted" style="margin:10px 4px">Joyni bosing — o'sha vaqtga o'tadi. Nom berish: botda <b>/joy Uy</b>. Vaqt bo'yicha: <b>/qayerda 14:30</b></div>`;
  return h;
}
const dayStart=()=>{const d=new Date(refMs());d.setHours(0,0,0,0);return d.getTime()};
function maxMin(){return Math.max(1,Math.floor((refMs()-dayStart())/60000))}
const QWD=['Yak','Du','Se','Chor','Pay','Ju','Sha'];
function qDayLabel(k){if(k===0)return 'Bugun';if(k===1)return 'Kecha';const d=new Date(refMs());d.setDate(d.getDate()-k);return `${QWD[d.getDay()]}, ${d.getDate()}`}
function qDays(){for(let k=0;k<7;k++){const b=document.getElementById('qd'+k);if(b)b.classList.toggle('on',k===ui.qd)}haptic('light')}
let QM=null;
/** Tanlangan kun va vaqtda qayerda bo'lgan */
function ask(){
  const v=(document.getElementById('qt').value||'').split(':');const out=document.getElementById('qres');
  if(v.length<2){out.innerHTML='<div class="small muted">Vaqtni kiriting, masalan 15:50</div>';return}
  ui.qt=`${v[0]}:${v[1]}`;const k=ui.qd;
  const base=new Date(refMs());base.setHours(0,0,0,0);base.setDate(base.getDate()-k);
  const t=base.getTime()/1000+(+v[0])*3600+(+v[1])*60;const label=`${qDayLabel(k)}, ${ui.qt}`;
  if(t*1000>refMs()){out.innerHTML=`<div class="small" style="color:var(--warn)">⚠️ Bu vaqt hali kelmagan</div>`;return}
  const st=k===0?(D.loc.s||[]):(D.loc.w||[]).filter(x=>x[0]===k).map(x=>x.slice(1));
  let p=null,html;
  const si=st.findIndex(s=>t>=s[2]&&t<=s[3]);
  if(si>=0){const s=st[si];p=[s[0],s[1]];
    html=`<div class="t16">📍 ${esc(s[4])}</div><div class="small muted" style="margin-top:2px">U yerda ${hm(s[2]*1000)} – ${hm(s[3]*1000)} bo'lgansiz · ${durMin(Math.round((s[3]-s[2])/60))}</div>`}
  else{
    if(k===0){const q=posAt(Math.round((t*1000-dayStart())/60000));if(q)p=[q[0],q[1]]}
    const pr=[...st].reverse().find(s=>s[3]<t),nx=st.find(s=>s[2]>t);
    if(!p&&pr&&nx){const f=(t-pr[3])/Math.max(1,nx[2]-pr[3]);p=[pr[0]+(nx[0]-pr[0])*f,pr[1]+(nx[1]-pr[1])*f]}
    if(pr||nx)html=`<div class="t16">🚗 Yo'lda edingiz</div><div class="small muted" style="margin-top:2px">${pr?`⬅️ ${esc(pr[4])} dan ${hm(pr[3]*1000)} da chiqqansiz`:''}${pr&&nx?'<br>':''}${nx?`➡️ ${esc(nx[4])} ga ${hm(nx[2]*1000)} da yetgansiz`:''}</div>`;
    else html=`<div class="small muted">📭 ${esc(label)} — bu vaqtda joylashuv yozilmagan</div>`}
  out.innerHTML=`<div style="background:color-mix(in srgb,#FFB86B 12%,transparent);border-radius:14px;padding:10px 12px"><div class="small" style="color:#FFB86B;font-weight:700">🕐 ${esc(label)}</div>${html}</div>`;
  if(p&&MAP&&window.L){if(QM)MAP.removeLayer(QM);
    QM=L.marker(p,{icon:L.divIcon({className:'',html:'<div style="width:22px;height:22px;border-radius:50%;background:#FFB86B;border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,184,107,.35)"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(MAP);
    MAP.setView(p,16);document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'})}
  haptic('light');
}
let MAP=null,TM=null;
/** Daqiqa (kun boshidan) → [lat,lon,stopIndex] */
function posAt(min){
  const L=D.loc,st=L.s||[],t=dayStart()/1000+min*60;
  const si=st.findIndex(s=>t>=s[2]&&t<=s[3]);if(si>=0)return [st[si][0],st[si][1],si];
  const path=L.p?decodePoly(L.p):[],tm=L.t||[];
  if(!path.length||tm.length!==path.length){return null}
  if(min<tm[0])return null;if(min>=tm[tm.length-1])return [...path[path.length-1],-1];
  let i=tm.findIndex(x=>x>min);const a=path[i-1],b=path[i],f=(min-tm[i-1])/Math.max(1,tm[i]-tm[i-1]);
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,-1];
}
function onSlide(min){
  const st=D.loc.s||[],t=dayStart()/1000+min*60;
  document.getElementById('selT').textContent=hm(t*1000);
  const p=posAt(min);let w;
  if(!p)w="Bu vaqtda ma'lumot yo'q";
  else if(p[2]>=0)w='📍 '+esc(st[p[2]][4]);
  else{const pr=[...st].reverse().find(s=>s[3]<t),nx=st.find(s=>s[2]>t);w=pr&&nx?`🚗 Yo'lda: ${esc(pr[4])} → ${esc(nx[4])}`:"🚗 Yo'lda"}
  document.getElementById('selW').innerHTML=w;
  if(MAP&&window.L){if(TM){MAP.removeLayer(TM);TM=null}
    if(p)TM=L.circleMarker([p[0],p[1]],{radius:9,color:'#fff',weight:3,fillColor:'#FFB86B',fillOpacity:1}).addTo(MAP)}
}
function jumpStop(i){const s=D.loc.s[i];const min=Math.round(((s[2]+s[3])/2*1000-dayStart())/60000);
  const el=document.getElementById('tsl');if(el){el.value=Math.min(+el.max,Math.max(0,min));onSlide(+el.value)}
  if(MAP)MAP.setView([s[0],s[1]],16);window.scrollTo({top:0,behavior:'smooth'})}
function openMap(k){const st=D.loc.s||[];if(!st.length)return;const ll=s=>`${s[0].toFixed(5)},${s[1].toFixed(5)}`;let u;
  if(k==='g'){u=st.length===1?`https://www.google.com/maps/search/?api=1&query=${ll(st[0])}`:
    `https://www.google.com/maps/dir/?api=1&origin=${ll(st[0])}&destination=${ll(st[st.length-1])}`+(st.length>2?'&waypoints='+st.slice(1,-1).slice(0,8).map(ll).join('%7C'):'')+'&travelmode=driving'}
  else u=st.length===1?`https://yandex.uz/maps/?pt=${st[0][1]},${st[0][0]}&z=16&l=map`:`https://yandex.uz/maps/?rtext=${st.slice(0,10).map(ll).join('~')}&rtt=auto`;
  if(inTg)tg.openLink(u);else window.open(u,'_blank')}
let leafletP=null;
function loadLeaflet(){if(window.L)return Promise.resolve();if(leafletP)return leafletP;
  leafletP=new Promise((ok,no)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);
    const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=e=>{leafletP=null;s.remove();no(e)};document.head.appendChild(s)});return leafletP}
let mapTok=0;
function killMap(){mapTok++;if(MAP){try{MAP.remove()}catch(e){}MAP=null;TM=null;QM=null}}
async function drawMap(){
  killMap();const tok=mapTok;
  try{await loadLeaflet()}catch(e){if(tok!==mapTok)return;const el=document.getElementById('map');if(el)el.innerHTML='<div class="small muted" style="padding:20px">Xaritani yuklab bo\'lmadi</div>';return}
  if(tok!==mapTok)return;
  const el=document.getElementById('map');if(!el||el._leaflet_id)return;
  MAP=L.map(el,{zoomControl:false}).setView([39.6542,66.9597],12);TM=null;QM=null;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  const path=D.loc.p?decodePoly(D.loc.p):[];const b=[...path];
  if(path.length>1)L.polyline(path,{color:'#7B5CFF',weight:5,opacity:.9}).addTo(MAP);
  (D.loc.s||[]).forEach((s,i)=>{b.push([s[0],s[1]]);
    L.marker([s[0],s[1]],{icon:L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50%;background:#5B3FE0;color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font:700 13px sans-serif;box-shadow:0 2px 6px #0006">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]})})
      .bindPopup(`<b>${esc(s[4])}</b><br>${hm(s[2]*1000)}–${hm(s[3]*1000)}`).addTo(MAP)});
  if(b.length===1)MAP.setView(b[0],15);else if(b.length>1)MAP.fitBounds(b,{padding:[30,30],maxZoom:16});
  const sl=document.getElementById('tsl');if(sl)onSlide(+sl.value);
}

// --- Profil ---

  const me=D.me||{};

// ---------- oynalar (pastdan chiquvchi) ----------
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('open');document.getElementById('sheetBg').classList.add('open');
  if(inTg){tg.BackButton.show()}}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetBg').classList.remove('open');if(inTg)tg.BackButton.hide()}
document.getElementById('sheetBg').onclick=closeSheet;
const cut=(s,n=150)=>{s=String(s??'');return s.length>n?s.slice(0,n-1)+'…':s};
function confirmAsk(text,ok){
  text=cut(text,250);
  if(inTg&&tg.showConfirm){try{tg.showConfirm(text,y=>{if(y)ok()});return}catch(e){}}
  if(confirm(text))ok();

const NF={text:'',day:'today',date:'',time:'',before:120,rep:'NONE'};
function openNote(){
  const d=new Date(Date.now()+3600e3);NF.text='';NF.day='today';NF.date=`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;NF.time=`${two(d.getHours())}:00`;NF.before=0;NF.rep='NONE';
  drawNote();setTimeout(()=>document.getElementById('nText')?.focus(),250);
}
function drawNote(){
  const B=[[0,"O'z vaqtida"],[15,'15 daq'],[30,'30 daq'],[60,'1 soat'],[120,'2 soat'],[180,'3 soat'],[1440,'1 kun']];
  const R=[['NONE','Bir marta'],['DAILY','Har kuni'],['WEEKDAYS','Ish kunlari'],['WEEKLY','Har hafta']];
  openSheet(`<h3>🔔 Yangi eslatma</h3>
  <div class="fl">Nima haqida?</div><input id="nText" class="field" placeholder="Masalan: To'yga borish" maxlength="300" value="${esc(NF.text)}" oninput="NF.text=this.value;chkNote()">
  <div class="fl" style="margin-top:14px">Qachon?</div>
  <div class="chips" style="margin-bottom:8px">${[['today','Bugun'],['tomorrow','Ertaga'],['pick','Sana tanlash']].map(([k,l])=>`<button class="chip ${NF.day===k?'on':''}" onclick="pickDay('${k}')">${l}</button>`).join('')}</div>
  <div style="display:flex;gap:10px">${NF.day==='pick'?`<input type="date" class="field" style="flex:1.4" value="${NF.date}" onchange="NF.date=this.value;chkNote()">`:''}<input type="time" class="field" style="flex:1" value="${NF.time}" onchange="NF.time=this.value;chkNote()"></div>
  <div class="fl" style="margin-top:14px">⏰ Qancha oldin eslatay?</div>
  <div class="chips">${B.map(([v,l])=>`<button class="chip ${NF.before===v?'on':''}" onclick="NF.before=${v};drawNote()">${l}</button>`).join('')}</div>
  <div class="fl" style="margin-top:14px">🔁 Takrorlash</div>
  <div class="chips">${R.map(([v,l])=>`<button class="chip ${NF.rep===v?'on':''}" onclick="NF.rep='${v}';drawNote()">${l}</button>`).join('')}</div>
  <div id="nWarn" class="small" style="color:var(--bad);min-height:18px;margin:10px 4px 0"></div>
  <button class="btnG" id="nSave" onclick="addNote()" style="margin-top:6px">Qo'shish</button>`);
  chkNote();
}
function pickDay(k){NF.day=k;const d=new Date();if(k==='tomorrow')d.setDate(d.getDate()+1);if(k!=='pick')NF.date=`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;drawNote()}
function noteTime(){const [y,m,d]=NF.date.split('-').map(Number);const [h,mi]=(NF.time||'').split(':').map(Number);if(!y||isNaN(h))return 0;return new Date(y,m-1,d,h,mi||0).getTime()}
function chkNote(){const t=noteTime();const w=document.getElementById('nWarn'),b=document.getElementById('nSave');if(!w)return;
  let msg='';if(!NF.text.trim())msg='';else if(!t||t<=Date.now())msg="Bu vaqt o'tib ketgan";else if(NF.before&&t-NF.before*60000<=Date.now())msg='Oldindan eslatish vaqti o\'tib ketgan — faqat o\'z vaqtida keladi';
  w.textContent=msg;b.disabled=!NF.text.trim()||!t||t<=Date.now()}
function addNote(){
  const t=noteTime();if(!NF.text.trim()||t<=Date.now())return;
  const id=tmpId--;const repL={NONE:'Bir marta',DAILY:'Har kuni',WEEKDAYS:'Ish kunlari (Du–Ju)',WEEKLY:'Har hafta'}[NF.rep];
  if(!queue({a:'note',text:NF.text.trim(),t:Math.floor(t/1000),before:NF.before,rep:NF.rep,_tmp:id}))return;
  D.notes.push([id,NF.text.trim(),Math.floor(t/1000),NF.before,repL]);closeSheet();toast("✅ Qo'shildi — «Saqlash»ni bosing");render();
}

const TF={inc:0,amt:'',note:''};
function openTx(){TF.inc=0;TF.amt='';TF.note='';drawTx();setTimeout(()=>document.getElementById('tAmt')?.focus(),250)}
function drawTx(){
  const sug=[...new Set([...(D.sum.MONTH?.[TF.inc?'it':'top']||[]).map(x=>x[0]),...(TF.inc?['Oylik','Bonus','Qarz qaytdi']:['Tushlik','Taksi','Bozor','Benzin','Kommunal'])])].slice(0,8);
  openSheet(`<h3>Yangi yozuv</h3>
  <div class="seg" style="margin-bottom:14px">${[[0,'− Chiqim'],[1,'+ Kirim']].map(([v,l])=>`<button class="${TF.inc===v?'on':''}" onclick="TF.inc=${v};drawTx()">${l}</button>`).join('')}</div>
  <div class="fl">Summa (so'm)</div>
  <input id="tAmt" class="field" inputmode="numeric" placeholder="25 000" value="${TF.amt?money(+TF.amt):''}" oninput="fmtAmt(this)" style="font-size:24px;font-weight:700">
  <div class="fl" style="margin-top:14px">${TF.inc?'Sababi':'Nimaga'}</div>
  <input id="tNote" class="field" maxlength="80" placeholder="${TF.inc?'Masalan: oylik':'Masalan: tushlik'}" value="${esc(TF.note)}" oninput="TF.note=this.value;chkTx()">
  <div class="chips" style="margin-top:10px">${sug.map(s=>`<button class="chip ${keyOf(TF.note)===keyOf(s)?'on':''}" onclick="TF.note=this.textContent;drawTx()">${esc(s)}</button>`).join('')}</div>
  <button class="btnG" id="tSave" onclick="addTx()" style="margin-top:18px">Qo'shish</button>`);
  chkTx();
}
function fmtAmt(el){const v=el.value.replace(/\D/g,'').slice(0,12);TF.amt=v;el.value=v?money(+v):'';chkTx()}
function chkTx(){const b=document.getElementById('tSave');if(b)b.disabled=!(+TF.amt>0)}
function addTx(){
  const amt=+TF.amt;if(!(amt>0))return;const note=TF.note.trim()||(TF.inc?'Kirim':'Boshqa');const id=tmpId--;const ts=Math.floor(Date.now()/1000);
  if(!queue({a:'tx',inc:TF.inc,amt,note,ts,_tmp:id}))return;
  const x=[id,TF.inc,amt,note,ts];D.tx.unshift(x);applyTx(x,1);closeSheet();toast("✅ Qo'shildi — «Saqlash»ni bosing");render();
}

// ---------- ishga tushirish ----------
async function boot(){
  if(inTg){
    tg.ready();tg.expand();
    if(tg.colorScheme==='light')document.documentElement.classList.add('light');
    try{tg.setHeaderColor(css('--bg'));tg.setBackgroundColor(css('--bg'))}catch(e){}
    tg.MainButton.onClick(save);tg.BackButton.onClick(closeSheet);
  }else if(matchMedia('(prefers-color-scheme: light)').matches&&new URLSearchParams(location.search).get('theme')!=='dark')document.documentElement.classList.add('light');
  if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.classList.add('light');
  document.getElementById('saveBtn').onclick=save;
  const m=location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
  try{
    if(m){D=await decode(m[1])}else{D=demoData();demo=true}
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="body" style="padding-top:40px"><div class="card empty"><div class="t16">Ma'lumotni o'qib bo'lmadi</div><div class="small muted" style="margin-top:6px">Telegram'ni yangilang yoki botda /start bosib, «📱 TUR ilova»ni qayta oching.</div></div></div>`;return;
  }
  D.notes=D.notes||[];D.calls=D.calls||[];D.rep=D.rep||[];D.tx=D.tx||[];D.days=D.days||[];D.sum=D.sum||{};
  {const r=new Date(refMs());if(typeof D.m!=='number')D.m=r.getMonth();const n=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();while(D.days.length<n)D.days.push(0);
    // "Qachon qayerda": 1 soat oldin; yarim tundan o'tsa — kecha
    const q=new Date(refMs()-3600e3);ui.qt=`${two(q.getHours())}:${two(q.getMinutes())}`;ui.qd=sameDay(q,r)?0:1}
  {const i=TABS().findIndex(t=>t[1]===ssGet('tab'));ui.tab=i>=0?i:0}
  for(const [p] of PERIODS){D.sum[p]=D.sum[p]||{i:0,e:0,top:[],it:[]};D.sum[p].top=D.sum[p].top||[];D.sum[p].it=D.sum[p].it||[]}
  // Botdagi «🗺 Xaritada ko'rish» tugmasi — to'g'ridan-to'g'ri Joylar bo'limi
  if(/[#&]t=loc/.test(location.hash)&&D.loc)ui.tab=TABS().findIndex(t=>t[3]===locTab);
  render();
}
boot();
